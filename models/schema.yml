models:
  - name: dim_listings_cleansed
    columns: 
      - name: listing_id
        tests:
          - not_null
          - unique
      - name: host_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                            'Hotel room']
  - name: dim_hosts_cleansed
    columns:
      - name: host_id
        tests:
          - not_null
          - unique
      - name: host_name
        tests:
          - not_null
      - name: is_superhost
        tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

