
name: 'airbnb'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'airbnb'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
asset-paths: ["assets"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  - "target-prod"


on-run-start:
  - "CREATE SCHEMA IF NOT EXISTS {{ target.database }}.{{ target.schema }}"
  - "CREATE TABLE IF NOT EXISTS {{ target.database }}.{{ target.schema }}.audit_log (
      model_name STRING,
      run_timestamp TIMESTAMP
    )"

models:
  airbnb:
    +post-hook:
      - "INSERT INTO {{ target.database }}.{{ target.schema }}.audit_log VALUES ('{{ this }}', CURRENT_TIMESTAMP)"
    +materialized: view
    dim:
      +materialized: table
    src:
      +materialized: ephemeral
    fct:
      +tags: ['fact']
      
seeds:
  airbnb:
    +schema: raw
    raw_hosts:
      +column_types:
        id: bigint
    raw_listings:
      +column_types:
        id: bigint
        price: varchar
    raw_reviews:
      +column_types:
        listing_id: bigint
    seed_full_moon_dates:
      +column_types:
        full_moon_date: date

data_tests:
  +store_failures: true
  +schema: test_results

vars:
  # Example project variable, used by the learn_variables macro.
  user_name: default_user