sources:
  - name: airbnb
    description: "Inside Airbnb data for Berlin, loaded as seeds into the raw schema."
    schema:  "{{ 'raw' if target.name == 'prod' else target.schema ~ '_raw' }}"
    tables:
      - name: listings
        description: "One row per Airbnb listing as published."
        identifier: raw_listings
        columns:
          - name: room_type
            data_tests:
              - dbt_expectations.expect_column_distinct_count_to_equal:
                  arguments:
                    value: 4
          - name: price
            description: "Price as text with dollar sign, e.g. '$90.00'."
            data_tests:
              - dbt_expectations.expect_column_values_to_match_regex:
                  arguments:
                    regex: "^\\$[0-9][0-9\\.]+$"
      - name: hosts
        description: "One row per host"
        identifier: raw_hosts
      - name: reviews
        description: "One row per guest review"
        columns:
          - name: date
            description: "Date the review was written; used for source freshness."
        identifier: raw_reviews
        config:
          loaded_at_field: date
          freshness:
            warn_after: {count: 1, period: hour}
            
